name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 22 is the floor in package.json "engines"; tests rely on Node's built-in type stripping.
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      # node:test only: no dependencies to install.
      - run: npm test

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      # npm installs the pi peer dependency, which provides the extension API types; this catches
      # breaking changes in the latest pi.
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
